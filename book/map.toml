# The technique map (the appendix "Technique map"): every technique of
# Part II on one path.
#
# A path is a family of techniques that build on each other. Its keys are
# in the order the map shows them: by grade, then in the chapter's order.
# The grade and the category of a technique come from its entry, so they
# are not repeated here. The book (technique-map in template.typ) and the
# website (website/book.py) both draw the map from this file, and the
# book's build fails when an entry is missing from it or is on two paths.
#
# The paths are the book's own grouping. Each one follows the "Related"
# lists of its entries.

# Names that are too long for a node, and the name the map shows instead.
[short]
regrip = "Re-gripping"
cutting-loose = "Cutting loose"

